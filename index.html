<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>تفاؤل — مغامرة الأبطال الصغار</title>
<style>
  :root{
    --purple:#7c5cbf; --purple-dark:#5d3fa3;
    --pink:#ff7eb3; --yellow:#ffd166; --green:#06d6a0;
    --red:#ef476f; --blue:#4cc9f0; --orange:#ff9f1c;
    --bg:#f6f2ff; --card:#ffffff; --text:#2d2350;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{
    font-family:"Segoe UI","Tahoma","Arial",sans-serif;
    background:linear-gradient(160deg,#e9defa 0%,#fbfcdb 100%);
    color:var(--text);
    min-height:100vh;
    display:flex;align-items:flex-start;justify-content:center;
    padding:12px;
  }
  #app{
    width:100%;max-width:560px;
    background:var(--card);border-radius:28px;
    box-shadow:0 20px 60px rgba(93,63,163,.25);
    padding:20px 16px;position:relative;overflow:hidden;
  }
  h1{font-size:1.45rem;color:var(--purple-dark);margin-bottom:8px;}
  h2{font-size:1.2rem;color:var(--purple-dark);margin-bottom:10px;}
  p{line-height:1.9;font-size:1.02rem;}
  .center{text-align:center;}
  .big-emoji{font-size:3.6rem;display:block;margin:8px auto;animation:bounce 2s infinite;}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  @keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
  @keyframes popIn{0%{transform:scale(0) translateY(20px)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
  .pop{animation:pop .35s ease;}
  .btn{
    display:inline-block;border:none;cursor:pointer;
    font-family:inherit;font-size:1.05rem;font-weight:bold;color:#fff;
    background:linear-gradient(135deg,var(--purple),var(--pink));
    padding:13px 28px;border-radius:50px;
    box-shadow:0 6px 0 rgba(93,63,163,.35);
    transition:transform .12s, box-shadow .12s;margin:6px 4px;
  }
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(93,63,163,.35);}
  .btn.secondary{background:linear-gradient(135deg,var(--blue),var(--green));box-shadow:0 6px 0 rgba(6,150,120,.35);}
  .btn.danger{background:linear-gradient(135deg,var(--red),#ff8fa3);box-shadow:0 6px 0 rgba(180,40,70,.35);}
  .btn.small{font-size:.92rem;padding:9px 18px;}
  input[type=text]{
    width:100%;max-width:300px;padding:12px 18px;border-radius:50px;
    border:3px solid var(--purple);font-size:1.1rem;font-family:inherit;
    text-align:center;outline:none;margin:10px auto;display:block;
  }
  .chip{
    background:var(--bg);border-radius:50px;padding:5px 12px;
    font-weight:bold;font-size:.9rem;color:var(--purple-dark);
    display:inline-flex;align-items:center;gap:4px;
  }
  .char-pick{display:flex;gap:14px;justify-content:center;margin:12px 0;}
  .char-card{
    background:var(--bg);border:4px solid transparent;border-radius:22px;
    padding:10px 14px;cursor:pointer;text-align:center;transition:border .15s, transform .15s;
  }
  .char-card.sel{border-color:var(--green);transform:scale(1.06);background:#eafff7;}
  .char-card span{font-weight:bold;font-size:.95rem;}
  /* الخريطة */
  .map-wrap{position:relative;margin:6px auto;max-width:440px;}
  .map-wrap svg{width:100%;height:auto;display:block;}
  .map-node{cursor:pointer;}
  .map-node.locked{cursor:default;opacity:.55;filter:grayscale(1);}
  .map-node.playable circle.ring{animation:pulse 1.6s infinite;transform-origin:center;transform-box:fill-box;}
  /* HUD */
  .hud{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;margin-bottom:6px;}
  #hearts{font-size:1.25rem;letter-spacing:2px;}
  .meter{
    position:relative;background:#e8e2f7;border-radius:50px;height:22px;
    overflow:hidden;margin:4px 0 8px;border:2px solid #d5cbef;
  }
  #meterFill{height:100%;width:50%;border-radius:50px;background:var(--green);transition:width .3s ease, background .3s ease;}
  .meter-label{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:.78rem;font-weight:bold;color:var(--text);pointer-events:none;
  }
  .game-wrap{position:relative;border-radius:18px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.15);}
  #gc{display:block;width:100%;height:auto;touch-action:none;}
  #flash{position:absolute;inset:0;pointer-events:none;opacity:0;}
  #flash.g{background:radial-gradient(circle,transparent 40%,rgba(6,214,160,.5));animation:flashA .45s ease;}
  #flash.r{background:radial-gradient(circle,transparent 30%,rgba(239,71,111,.55));animation:flashA .45s ease;}
  @keyframes flashA{0%{opacity:1}100%{opacity:0}}
  .controls{display:flex;gap:10px;justify-content:center;margin-top:10px;direction:ltr;}
  .ctrl{
    flex:1;max-width:170px;font-size:1.5rem;padding:12px 0;border:none;border-radius:18px;cursor:pointer;
    background:linear-gradient(135deg,var(--purple),var(--pink));color:#fff;
    box-shadow:0 5px 0 rgba(93,63,163,.35);user-select:none;touch-action:manipulation;font-weight:bold;
  }
  .ctrl:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(93,63,163,.35);}
  .ctrl.jump{max-width:260px;background:linear-gradient(135deg,var(--green),var(--blue));box-shadow:0 5px 0 rgba(6,150,120,.35);}
  /* تنبيهات */
  #toast{
    position:absolute;left:50%;bottom:90px;transform:translateX(-50%);
    max-width:88%;padding:10px 18px;border-radius:16px;font-weight:bold;font-size:.95rem;
    color:#fff;background:rgba(45,35,80,.92);text-align:center;z-index:20;
    opacity:0;pointer-events:none;transition:opacity .25s;line-height:1.6;
  }
  #toast.show{opacity:1;}
  #toast.good{background:rgba(4,150,110,.94);}
  #toast.bad{background:rgba(210,50,90,.94);}
  /* السوبرماركت */
  .shelf-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0;}
  .shelf-item{
    background:linear-gradient(180deg,#fff, #f1ecff);
    border:3px solid #d5cbef;border-radius:16px;
    padding:10px 4px 6px;text-align:center;cursor:pointer;
    font-family:inherit;transition:transform .12s, border .12s;
  }
  .shelf-item .pe{font-size:2rem;display:block;}
  .shelf-item .pn{font-size:.72rem;font-weight:bold;color:var(--purple-dark);}
  .shelf-item:active{transform:scale(.94);}
  .shelf-item.found{border-color:var(--green);background:#d9f9ee;pointer-events:none;}
  .shelf-item.wrong{border-color:var(--red);background:#ffe3ea;animation:shake .3s;}
  .list-paper{
    background:#fffdf0;border:3px dashed var(--yellow);border-radius:18px;
    padding:14px;margin:10px auto;max-width:320px;text-align:center;
  }
  .list-paper .li{font-size:1.05rem;font-weight:bold;margin:4px 0;}
  .cartbar{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;
    background:var(--bg);border-radius:14px;padding:8px;margin-top:8px;min-height:44px;font-size:1.3rem;}
  /* المهرجان */
  .whack-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0;}
  .hole{
    position:relative;aspect-ratio:1;border:none;border-radius:20px;cursor:pointer;
    background:linear-gradient(180deg,#c8b6ff,#a78bfa);
    font-family:inherit;overflow:hidden;padding:0;
    box-shadow:inset 0 -6px 0 rgba(93,63,163,.3);
  }
  .hole .tent{font-size:2rem;opacity:.5;}
  .hole .popup{
    position:absolute;inset:4px;border-radius:16px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;animation:popIn .18s ease;
  }
  .hole .popup.myth{background:#3d3554;color:#fff;}
  .hole .popup.hope{background:#ffe3f1;color:#c1256b;}
  .hole .popup .pe{font-size:1.9rem;}
  .hole .popup .pt{font-size:.72rem;font-weight:bold;line-height:1.3;padding:0 4px;}
  /* عناصر عامة */
  .answer{
    display:block;width:100%;text-align:right;background:var(--bg);
    border:3px solid transparent;border-radius:18px;padding:13px 16px;
    font-size:1.02rem;font-family:inherit;font-weight:600;color:var(--text);
    cursor:pointer;margin-bottom:10px;transition:border .15s, background .15s;
  }
  .answer:hover{border-color:var(--purple);}
  .card-item{
    background:linear-gradient(135deg,#fff,var(--bg));
    border:3px solid var(--purple);border-radius:22px;
    padding:18px 16px;text-align:center;font-size:1.05rem;font-weight:bold;
    margin:12px 0;animation:pop .3s ease;
  }
  .fact-box{
    background:#fff8e1;border:2px dashed var(--yellow);border-radius:18px;
    padding:12px 16px;margin:12px 0;font-size:.98rem;line-height:1.8;text-align:right;
  }
  .stars{font-size:1.9rem;letter-spacing:4px;margin:8px 0;}
  .cert{
    border:6px double var(--purple);border-radius:22px;
    padding:22px 14px;background:linear-gradient(160deg,#fffdf5,#f3edff);
    text-align:center;margin:12px 0;
  }
  .cert .name{font-size:1.5rem;color:var(--pink);font-weight:bold;margin:8px 0;}
  #confetti{position:absolute;inset:0;pointer-events:none;z-index:30;}
  .muted{color:#8a80a8;font-size:.88rem;line-height:1.8;}
  .heart{color:var(--red);}
  .howto{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0;}
  .howto .chip{font-size:.83rem;}
  .pausebtn{border:none;background:var(--bg);border-radius:50px;font-size:1rem;padding:5px 12px;cursor:pointer;font-weight:bold;color:var(--purple-dark);}
  .sunbtn{
    position:absolute;left:50%;bottom:22px;transform:translateX(-50%);
    border:none;border-radius:50px;padding:14px 30px;font-size:1.25rem;font-weight:bold;
    font-family:inherit;color:#7a4d00;background:linear-gradient(135deg,#ffd166,#ffb703);
    box-shadow:0 6px 0 rgba(180,120,0,.4);cursor:pointer;z-index:15;
    animation:pulse .5s infinite;
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="confetti"></canvas>
  <div id="screen"></div>
</div>

<script>
"use strict";

/* ================= الحالة والحفظ ================= */
const state = { name:"", gender:"boy", stars:[0,0,0,0,0], score:0 };
function saveState(){ try{ localStorage.setItem("tafaul-save", JSON.stringify(state)); }catch(e){} }
function loadState(){
  try{
    const s = JSON.parse(localStorage.getItem("tafaul-save"));
    if(s && typeof s === "object"){
      state.name = s.name || "";
      state.gender = s.gender === "girl" ? "girl" : "boy";
      if(Array.isArray(s.stars) && s.stars.length === 5) state.stars = s.stars.map(n=>+n||0);
      state.score = +s.score || 0;
    }
  }catch(e){}
}
function esc(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

const screen = document.getElementById("screen");
let L = null; // بيانات المرحلة النشطة
function stopLevel(){
  if(L){ L.active = false; (L.timers||[]).forEach(t=>{clearTimeout(t);clearInterval(t);}); }
  L = null;
}
function render(html){
  screen.innerHTML = html;
  screen.classList.remove("pop"); void screen.offsetWidth; screen.classList.add("pop");
  window.scrollTo(0,0);
}
function starsOf(n){ return "⭐".repeat(n) + "☆".repeat(Math.max(0,3-n)); }

/* ================= الأصوات ================= */
let audioCtx = null;
function beep(freq, dur=0.15, type="sine", vol=0.14){
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}
const soundGood = () => { beep(660,.1); setTimeout(()=>beep(880,.15),90); };
const soundBad  = () => beep(170,.28,"square");
const soundHurt = () => { beep(200,.15,"square"); setTimeout(()=>beep(130,.3,"square"),120); };
const soundWin  = () => [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.2),i*140));
const soundJump = () => beep(500,.12,"triangle",.1);
const soundWhack= () => { beep(300,.06,"square",.12); setTimeout(()=>beep(700,.1),60); };

/* ================= قصاصات ================= */
function confetti(){
  const c = document.getElementById("confetti");
  c.width = c.offsetWidth; c.height = c.offsetHeight;
  const x = c.getContext("2d");
  const colors = ["#ff7eb3","#ffd166","#06d6a0","#4cc9f0","#7c5cbf"];
  const parts = Array.from({length:90},()=>({
    x:Math.random()*c.width, y:-20-Math.random()*c.height*.5,
    r:4+Math.random()*6, vy:2+Math.random()*3, vx:-1+Math.random()*2,
    color:colors[Math.floor(Math.random()*colors.length)], rot:Math.random()*Math.PI
  }));
  let fr = 0;
  (function draw(){
    x.clearRect(0,0,c.width,c.height);
    parts.forEach(p=>{
      p.y+=p.vy; p.x+=p.vx; p.rot+=.05;
      x.save(); x.translate(p.x,p.y); x.rotate(p.rot);
      x.fillStyle=p.color; x.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6); x.restore();
    });
    if(++fr<160) requestAnimationFrame(draw);
    else x.clearRect(0,0,c.width,c.height);
  })();
}

/* ================= رسم الشخصية ================= */
function drawKid(c, x, y, ph, gender, face, scale=1){
  const swing = Math.sin(ph);
  c.save(); c.translate(x,y); c.scale(scale,scale);
  c.fillStyle = "rgba(0,0,0,.16)";
  c.beginPath(); c.ellipse(0,56,26,7,0,0,7); c.fill();
  c.strokeStyle = "#3b5bdb"; c.lineWidth = 10; c.lineCap = "round";
  c.beginPath(); c.moveTo(-8,18); c.lineTo(-8+swing*9,48); c.stroke();
  c.beginPath(); c.moveTo(8,18); c.lineTo(8-swing*9,48); c.stroke();
  c.fillStyle = "#22223b";
  c.beginPath(); c.ellipse(-8+swing*9,51,8,4.5,0,0,7); c.fill();
  c.beginPath(); c.ellipse(8-swing*9,51,8,4.5,0,0,7); c.fill();
  const shirt = gender==="girl" ? "#ff7eb3" : "#06d6a0";
  c.strokeStyle = shirt; c.lineWidth = 8;
  c.beginPath(); c.moveTo(-13,-6); c.lineTo(-21-swing*6,14); c.stroke();
  c.beginPath(); c.moveTo(13,-6); c.lineTo(21+swing*6,14); c.stroke();
  c.fillStyle = "#ffd9b3";
  c.beginPath(); c.arc(-21-swing*6,16,4.5,0,7); c.fill();
  c.beginPath(); c.arc(21+swing*6,16,4.5,0,7); c.fill();
  c.fillStyle = shirt;
  c.beginPath();
  if(c.roundRect) c.roundRect(-16,-14,32,36,10); else c.rect(-16,-14,32,36);
  c.fill();
  if(gender==="girl"){
    c.beginPath(); c.moveTo(-16,14); c.lineTo(16,14); c.lineTo(22,26); c.lineTo(-22,26); c.closePath();
    c.fillStyle = "#e0509b"; c.fill();
  }
  c.font = "11px serif"; c.textAlign="center";
  c.fillText("🎗️", 0, 2);
  c.fillStyle = "#ffd9b3";
  c.beginPath(); c.arc(0,-34,20,0,7); c.fill();
  c.fillStyle = "#4a3728";
  if(gender==="girl"){
    c.beginPath(); c.arc(0,-38,21,Math.PI*0.9,Math.PI*2.1); c.fill();
    c.beginPath();
    if(c.roundRect){ c.roundRect(-24,-42,9,32,4); c.roundRect(15,-42,9,32,4); }
    else { c.rect(-24,-42,9,32); c.rect(15,-42,9,32); }
    c.fill();
    c.fillStyle = "#ff4f9a";
    c.beginPath(); c.moveTo(10,-52); c.lineTo(20,-58); c.lineTo(20,-46); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(10,-52); c.lineTo(2,-58); c.lineTo(2,-46); c.closePath(); c.fill();
    c.beginPath(); c.arc(10,-52,3,0,7); c.fill();
  } else {
    c.beginPath(); c.arc(0,-40,20,Math.PI,Math.PI*2); c.fill();
    c.beginPath(); c.arc(-14,-38,6,0,7); c.arc(14,-38,6,0,7); c.fill();
  }
  c.fillStyle = "#2d2350";
  const eyeR = face==="wow" ? 3.4 : 2.6;
  c.beginPath(); c.arc(-7,-36,eyeR,0,7); c.arc(7,-36,eyeR,0,7); c.fill();
  c.fillStyle = "rgba(255,126,179,.5)";
  c.beginPath(); c.arc(-13,-29,3.4,0,7); c.arc(13,-29,3.4,0,7); c.fill();
  c.strokeStyle = "#c1445f"; c.lineWidth = 2.4; c.lineCap="round";
  if(face==="sad"){ c.beginPath(); c.arc(0,-22,6,Math.PI*1.15,Math.PI*1.85); c.stroke(); }
  else if(face==="wow"){ c.fillStyle="#c1445f"; c.beginPath(); c.arc(0,-25,4,0,7); c.fill(); }
  else { c.beginPath(); c.arc(0,-30,7,Math.PI*0.15,Math.PI*0.85); c.stroke(); }
  c.restore();
}
/* الشخصية من الخلف (لممر المدرسة) */
function drawKidBack(c, x, y, ph, gender, scale=1){
  const swing = Math.sin(ph);
  c.save(); c.translate(x,y); c.scale(scale,scale);
  c.fillStyle = "rgba(0,0,0,.16)";
  c.beginPath(); c.ellipse(0,56,26,7,0,0,7); c.fill();
  c.strokeStyle = "#3b5bdb"; c.lineWidth = 10; c.lineCap = "round";
  c.beginPath(); c.moveTo(-8,18); c.lineTo(-8+swing*9,48); c.stroke();
  c.beginPath(); c.moveTo(8,18); c.lineTo(8-swing*9,48); c.stroke();
  c.fillStyle = "#22223b";
  c.beginPath(); c.ellipse(-8+swing*9,51,8,4.5,0,0,7); c.fill();
  c.beginPath(); c.ellipse(8-swing*9,51,8,4.5,0,0,7); c.fill();
  const shirt = gender==="girl" ? "#ff7eb3" : "#06d6a0";
  c.strokeStyle = shirt; c.lineWidth = 8;
  c.beginPath(); c.moveTo(-13,-6); c.lineTo(-21+swing*6,14); c.stroke();
  c.beginPath(); c.moveTo(13,-6); c.lineTo(21-swing*6,14); c.stroke();
  c.fillStyle = shirt;
  c.beginPath();
  if(c.roundRect) c.roundRect(-16,-14,32,36,10); else c.rect(-16,-14,32,36);
  c.fill();
  if(gender==="girl"){
    c.beginPath(); c.moveTo(-16,14); c.lineTo(16,14); c.lineTo(22,26); c.lineTo(-22,26); c.closePath();
    c.fillStyle = "#e0509b"; c.fill();
  }
  // حقيبة الظهر
  c.fillStyle = "#ef476f";
  c.beginPath();
  if(c.roundRect) c.roundRect(-12,-12,24,28,8); else c.rect(-12,-12,24,28);
  c.fill();
  c.strokeStyle = "#c1304f"; c.lineWidth = 3;
  c.beginPath(); c.moveTo(0,-12); c.lineTo(0,16); c.stroke();
  // الرأس من الخلف: شعر كامل
  c.fillStyle = "#4a3728";
  c.beginPath(); c.arc(0,-34,20,0,7); c.fill();
  if(gender==="girl"){
    // ضفيرتان
    c.beginPath();
    if(c.roundRect){ c.roundRect(-26,-36,9,30,4); c.roundRect(17,-36,9,30,4); }
    else { c.rect(-26,-36,9,30); c.rect(17,-36,9,30); }
    c.fill();
    c.fillStyle = "#ff4f9a";
    c.beginPath(); c.arc(-21,-8,4,0,7); c.arc(21,-8,4,0,7); c.fill();
  }
  c.restore();
}

/* ================= أدوات مشتركة للمراحل ================= */
function hudHtml(goalLabel){
  return `
    <div class="hud">
      <span id="hearts">❤️❤️❤️</span>
      <span class="chip" id="goalChip">${goalLabel}</span>
      <span class="chip">🏆 <span id="scoreEl">0</span></span>
      <span class="chip" id="timerChip" style="display:none">⏱ <span id="timerEl"></span></span>
    </div>
    <div class="meter">
      <div id="meterFill"></div>
      <span class="meter-label">مؤشر الصحة 💚</span>
    </div>`;
}
function updateHUD(){
  if(!L) return;
  const h = document.getElementById("hearts");
  if(h) h.textContent = "❤️".repeat(Math.max(0,L.hearts)) + "🤍".repeat(Math.max(0,3-L.hearts));
  const s = document.getElementById("scoreEl");
  if(s) s.textContent = L.score;
  const m = document.getElementById("meterFill");
  if(m){
    m.style.width = L.meter + "%";
    m.style.background = L.meter > 60 ? "linear-gradient(90deg,#06d6a0,#4cc9f0)"
                       : L.meter > 30 ? "linear-gradient(90deg,#ff9f1c,#ffd166)"
                       : "linear-gradient(90deg,#ef476f,#ff8fa3)";
  }
}
let toastTimer = null;
function toast(msg, type="", ms=1900){
  let t = document.getElementById("toast");
  if(!t){
    t = document.createElement("div"); t.id = "toast";
    document.getElementById("app").appendChild(t);
  }
  t.className = ""; void t.offsetWidth;
  t.innerHTML = msg; t.className = "show " + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ t.className = ""; }, ms);
}
function flash(cls){
  const f = document.getElementById("flash");
  if(!f) return;
  f.className = ""; void f.offsetWidth; f.className = cls;
}
function gain(pts, meterUp, msg){
  if(!L) return;
  L.score += pts; L.meter = Math.min(100, L.meter + meterUp);
  if(msg) toast(msg, "good", 1500);
  flash("g"); soundGood(); updateHUD();
}
function damage(meterDown, msg){
  if(!L) return false;
  L.meter -= meterDown;
  if(msg) toast(msg, "bad", 2100);
  flash("r"); soundBad();
  if(L.meter <= 0){
    L.hearts--; L.meter = 45;
    toast("💔 انخفض مؤشر الصحة كثيراً! خسرت قلباً", "bad", 2300);
    soundHurt();
  }
  L.meter = Math.max(0, Math.min(100, L.meter));
  updateHUD();
  if(L.hearts <= 0){ failLevel(); return true; }
  return false;
}
function loseHeart(msg){
  if(!L) return false;
  L.hearts--;
  if(msg) toast("💔 " + msg, "bad", 2300);
  flash("r"); soundHurt(); updateHUD();
  if(L.hearts <= 0){ failLevel(); return true; }
  return false;
}

function completeLevel(statsHtml){
  const i = L.i, hearts = L.hearts, score = L.score;
  const stars = Math.max(1, hearts);
  state.stars[i] = Math.max(state.stars[i], stars);
  state.score += score;
  saveState();
  stopLevel();
  soundWin(); confetti();
  const w = WORLD_META[i];
  const next = i < 4 ? i+1 : null;
  render(`
    <div class="center">
      <span class="big-emoji">${stars===3?"🏆":stars===2?"🎉":"💪"}</span>
      <h2>أنهيت مهمة ${w.name}!</h2>

function hmStart(){
  stopLevel();
  render(`
    ${hudHtml("🔍 <span id='foundEl'>0</span> / 6")}
    <div class="game-wrap">
      <canvas id="gc" width="480" height="620"></canvas>
      <div id="flash"></div>
    </div>
    <div class="controls">
      <button class="ctrl" id="btnL">⟸ انظر</button>
      <button class="ctrl" id="btnR">انظر ⟹</button>
    </div>
    <p class="center muted">👆 اسحب الشاشة أو استخدم الأزرار لتنظر حول البيت</p>
  `);
  L = {
    i:0, type:"home", active:true, timers:[],
    hearts:3, meter:50, score:0,
    cam: 0, camV: 0, found: 0, time: 75, t:0, last: performance.now(),
    spots: HM_SPOTS.map(s=>({...s, taken:false})),
    drag: null,
  };
  const cv = document.getElementById("gc");
  const scaleOf = () => cv.getBoundingClientRect().width / cv.width;
  cv.addEventListener("pointerdown", e=>{
    if(!L || L.type!=="home") return;
    L.drag = { sx:e.clientX, cam:L.cam, moved:false };
    cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener("pointermove", e=>{
    if(!L || L.type!=="home" || !L.drag) return;
    const dx = (e.clientX - L.drag.sx) / scaleOf();
    if(Math.abs(dx) > 8) L.drag.moved = true;
    L.cam = Math.max(0, Math.min(HM_W-480, L.drag.cam - dx));
  });
  cv.addEventListener("pointerup", e=>{
    if(!L || L.type!=="home") return;
    const wasDrag = L.drag && L.drag.moved;
    L.drag = null;
    if(wasDrag) return;
    const r = cv.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width * 480 + L.cam;
    const py = (e.clientY - r.top) / r.height * 620;
    hmClick(px, py);
  });
  document.getElementById("btnL").addEventListener("pointerdown", ()=>{ if(L&&L.type==="home") L.camV = -420; });
  document.getElementById("btnL").addEventListener("pointerup",   ()=>{ if(L&&L.type==="home") L.camV = 0; });
  document.getElementById("btnR").addEventListener("pointerdown", ()=>{ if(L&&L.type==="home") L.camV = 420; });
  document.getElementById("btnR").addEventListener("pointerup",   ()=>{ if(L&&L.type==="home") L.camV = 0; });
  document.getElementById("timerChip").style.display = "";
  updateHUD();
  requestAnimationFrame(hmLoop);
}
function hmClick(px, py){
  for(const s of L.spots){
    if(s.taken) continue;
    if(Math.hypot(px-s.x, py-s.y) < 34){
      if(s.good){
        s.taken = true; L.found++;
        gain(15, 8, `✅ ${s.e} <b>${s.label}</b> — ${s.why}`);
        const f = document.getElementById("foundEl");
        if(f) f.textContent = L.found;
        if(L.found >= 6){
          const bonus = Math.max(0, Math.round(L.time)) * 2;
          L.score += bonus;
          setTimeout(()=>{ if(L) completeLevel(`وجدت كل الاختيارات الصحية الستة! 🔍<br>مكافأة الوقت المتبقي: <b>+${bonus}</b> نقطة`); }, 600);
        }
      } else {
        s.taken = true;
        damage(18, `${s.e} <b>${s.label}</b>! ${s.why}`);
      }
      return;
    }
  }
}
function hmLoop(now){
  if(!L || L.type!=="home" || !L.active) return;
  const dt = Math.min(.05,(now-L.last)/1000); L.last = now; L.t += dt;
  L.cam = Math.max(0, Math.min(HM_W-480, L.cam + L.camV*dt));
  L.time -= dt;
  const te = document.getElementById("timerEl");
  if(te) te.textContent = Math.max(0, Math.ceil(L.time));
  if(L.time <= 0){
    L.time = 40;
    if(loseHeart("انتهى الوقت! خذ 40 ثانية إضافية")) return;
  }
  const cv = document.getElementById("gc");
  if(!cv){ L.active=false; return; }
  const c = cv.getContext("2d");
  c.save();
  c.translate(-L.cam, 0);
  hmDrawHouse(c, L.t);
  // العناصر
  c.textAlign = "center"; c.font = "34px serif";
  L.spots.forEach(s=>{
    if(s.taken){
      if(s.good){ c.font="30px serif"; c.fillText("✅", s.x, s.y); c.font="34px serif"; }
      return;
    }
    const bob = Math.sin(L.t*2 + s.x)*4;
    // هالة خفيفة للتلميح
    c.fillStyle = "rgba(255,255,255,.35)";
    c.beginPath(); c.arc(s.x, s.y-12+bob, 26, 0, 7); c.fill();
    c.fillText(s.e, s.x, s.y+bob);
  });
  c.restore();
  // مؤشر البانوراما
  c.fillStyle = "rgba(93,63,163,.25)";
  c.beginPath(); if(c.roundRect) c.roundRect(120, 596, 240, 10, 5); else c.rect(120,596,240,10); c.fill();
  c.fillStyle = "#7c5cbf";
  const pw = 240 * (480/HM_W);
  c.beginPath(); if(c.roundRect) c.roundRect(120 + (L.cam/(HM_W-480))*(240-pw), 596, pw, 10, 5); else c.rect(120,596,pw,10); c.fill();
  requestAnimationFrame(hmLoop);
}

/* ============================================================
   المرحلة 2: ممر المدرسة — ركض منظور ثلاثي الأبعاد مع بوابات
   ============================================================ */
const SC_QUESTIONS = [
  {q:"هل السرطان مرض معدٍ؟", a:["نعم 😷","لا! أبداً 🤗"], correct:1, why:"لا ينتقل باللمس أو اللعب أو الطعام"},
  {q:"ما الأفضل لفطور البطل؟", a:["🍎 تفاحة وحليب","🍩 دونات ومشروب غازي"], correct:0, why:"الفطور الصحي = طاقة ليوم كامل"},
  {q:"غسل اليدين قبل الأكل؟", a:["مضيعة وقت","يحمي من الجراثيم 🧼"], correct:1, why:"الجراثيم لا تُرى بالعين!"},
  {q:"سقط شعر صديقك بسبب العلاج...", a:["أسانده، سيعود شعره 💜","أضحك عليه"], correct:0, why:"الشعر ينمو من جديد بعد العلاج"},
  {q:"الفحص المبكر للمرض...", a:["يجعل العلاج أسهل 🩺","لا فائدة منه"], correct:0, why:"كلما اكتُشف مبكراً كان الشفاء أقرب"},
  {q:"هل المرض عقاب للمريض؟", a:["نعم بسبب أخطائه","لا! ليس ذنب أحد 💜"], correct:1, why:"لا أحد يمرض لأنه فعل شيئاً سيئاً"},
  {q:"ساعة حركة ولعب كل يوم؟", a:["تقوّي الجسم 💪","بلا فائدة"], correct:0, why:"الرياضة تجعل خلاياك قوية ونشيطة"},
  {q:"صديقك المريض يحتاج منك...", a:["الابتعاد عنه","دعمك ولعبك معه 🤝"], correct:1, why:"الصداقة أقوى دواء!"},
];
function scStart(){
  stopLevel();
  render(`
    ${hudHtml(`🚪 <span id='gateEl'>0</span> / ${SC_QUESTIONS.length}`)}
    <div class="game-wrap">
      <canvas id="gc" width="480" height="620"></canvas>
      <div id="flash"></div>
    </div>
    <div class="controls">
      <button class="ctrl" id="btnL">⬅ يسار</button>
      <button class="ctrl" id="btnR">يمين ➡</button>
    </div>
  `);
  L = {
    i:1, type:"school", active:true, timers:[],
    hearts:3, meter:50, score:0,
    qi:0, side:0, // -1 يسار / 1 يمين / 0 وسط
    z:1, zSpeed:.22, t:0, last:performance.now(),
    resolved:false,
  };
  const cv = document.getElementById("gc");
  cv.addEventListener("pointerdown", e=>{
    if(!L || L.type!=="school") return;
    const r = cv.getBoundingClientRect();
    L.side = (e.clientX - r.left)/r.width < .5 ? -1 : 1;
    beep(440,.05,"triangle",.06);
  });
  document.getElementById("btnL").addEventListener("pointerdown", ()=>{ if(L&&L.type==="school"){ L.side=-1; beep(440,.05,"triangle",.06);} });
  document.getElementById("btnR").addEventListener("pointerdown", ()=>{ if(L&&L.type==="school"){ L.side=1; beep(440,.05,"triangle",.06);} });
  updateHUD();
  requestAnimationFrame(scLoop);
}
document.addEventListener("keydown", e=>{
  if(!L) return;
  if(L.type==="school"){
    if(e.key==="ArrowLeft"){ L.side=-1; e.preventDefault(); }
    if(e.key==="ArrowRight"){ L.side=1; e.preventDefault(); }
  }
  if(L.type==="park" && (e.key===" "||e.key==="ArrowUp")){ pkJump(); e.preventDefault(); }
  if(L.type==="home"){
    if(e.key==="ArrowLeft"){ L.cam=Math.max(0,L.cam-60); e.preventDefault(); }
    if(e.key==="ArrowRight"){ L.cam=Math.min(HM_W-480,L.cam+60); e.preventDefault(); }
  }
});
const VPX=240, VPY=195;
function scProj(lx, z){
  const n = Math.pow(1-z, 1.6);
  const s = .1 + n*.9;
  return { x: VPX + lx*190*s, y: VPY + 400*s, s };
}
function scLoop(now){
  if(!L || L.type!=="school" || !L.active) return;
  const dt = Math.min(.05,(now-L.last)/1000); L.last = now; L.t += dt;
  L.z -= L.zSpeed*dt;
  // الوصول للبوابة
  if(L.z <= 0.06 && !L.resolved){
    L.resolved = true;
    const q = SC_QUESTIONS[L.qi];
    const chosen = L.side === -1 ? 0 : 1;
    if(L.side === 0 || chosen !== q.correct){
      if(damage(22, `🚪 ${L.side===0?"لم تختر بوابة!":"بوابة خاطئة!"} — ${q.why}`)) return;
    } else {
      gain(20, 7, `🎉 صحيح! ${q.why}`);
    }
    const g = document.getElementById("gateEl");
    if(g) g.textContent = L.qi+1;
    L.qi++;
    if(L.qi >= SC_QUESTIONS.length){
      setTimeout(()=>{ if(L) completeLevel(`عبرت <b>${SC_QUESTIONS.length}</b> بوابات معرفة في ممر المدرسة ثلاثي الأبعاد! 🏃`); }, 500);
      L.active = false;
      return;
    }
    L.z = 1; L.side = 0; L.resolved = false;
    L.zSpeed = Math.min(.34, L.zSpeed + .015);
  }
  scDraw();
  requestAnimationFrame(scLoop);
}
function scDraw(){
  const cv = document.getElementById("gc");
  if(!cv){ L.active=false; return; }
  const c = cv.getContext("2d");
  const W=480, H=620;
  // سقف وأرضية وجدران بمنظور
  c.fillStyle="#fdf0d5"; c.fillRect(0,0,W,H);       // جدران بعيدة
  // السقف
  c.fillStyle="#e8e0f5";
  c.beginPath(); c.moveTo(0,0); c.lineTo(W,0); c.lineTo(VPX+60,VPY-40); c.lineTo(VPX-60,VPY-40); c.closePath(); c.fill();
  // الأرضية
  const fl = c.createLinearGradient(0,VPY,0,H);
  fl.addColorStop(0,"#cbb9ec"); fl.addColorStop(1,"#a58fd8");
  c.fillStyle=fl;
  c.beginPath(); c.moveTo(VPX-60,VPY); c.lineTo(VPX+60,VPY); c.lineTo(W+80,H); c.lineTo(-80,H); c.closePath(); c.fill();
  // الجدار الأيسر والأيمن
  c.fillStyle="#f5e3c8";
  c.beginPath(); c.moveTo(0,0); c.lineTo(VPX-60,VPY-40); c.lineTo(VPX-60,VPY); c.lineTo(-80,H); c.lineTo(0,H); c.closePath(); c.fill();
  c.beginPath(); c.moveTo(W,0); c.lineTo(VPX+60,VPY-40); c.lineTo(VPX+60,VPY); c.lineTo(W+80,H); c.lineTo(W,H); c.closePath(); c.fill();
  // خطوط الأرضية متحركة (إحساس الجري)
  c.strokeStyle="rgba(255,255,255,.5)"; c.lineWidth=2;
  for(let k=0;k<7;k++){
    const zz = ((k/7) + (L.t*L.zSpeed*3)) % 1;
    const p = scProj(0, zz);
    const halfW = 60 + (1-zz < 1 ? Math.pow(1-zz,1.6) : 1) * 340;
    const pl = scProj(-1.6, zz), pr = scProj(1.6, zz);
    c.beginPath(); c.moveTo(pl.x, p.y); c.lineTo(pr.x, p.y); c.stroke();
  }
  // أبواب صفوف على الجدران
  c.fillStyle="#8d5a2b";
  [[0.25,-1],[0.55,-1],[0.85,-1],[0.4,1],[0.7,1]].forEach(([zz,sd])=>{
    const zAnim = (zz + L.t*L.zSpeed*.6) % 1;
    const p = scProj(sd*1.45, zAnim);
    const dw = 40*p.s, dh = 110*p.s;
    c.globalAlpha = Math.min(1, p.s*1.4);
    c.fillRect(p.x-dw/2, p.y-dh, dw, dh);
    c.globalAlpha = 1;
  });
  // لافتات على الجدار
  c.font="bold 15px sans-serif"; c.textAlign="center"; c.fillStyle="#5d3fa3";
  c.fillText("🎗️ ممر المعرفة 🎗️", VPX, VPY-50);
  // البوابتان
  const q = SC_QUESTIONS[L.qi];
  if(q && L.z > 0.05){
    [[-0.62, 0],[0.62, 1]].forEach(([lx, ai])=>{
      const p = scProj(lx, L.z);
      const gw = 150*p.s, gh = 190*p.s;
      const isCorrectSide = null; // لا نكشف الإجابة
      c.fillStyle = ai===0 ? "#4cc9f0" : "#ff9f1c";
      // عمودان
      c.fillRect(p.x-gw/2, p.y-gh, gw*.13, gh);
      c.fillRect(p.x+gw/2-gw*.13, p.y-gh, gw*.13, gh);
      // قوس علوي
      c.beginPath();
      if(c.roundRect) c.roundRect(p.x-gw/2, p.y-gh-16*p.s, gw, 26*p.s, 8*p.s); else c.rect(p.x-gw/2, p.y-gh-16*p.s, gw, 26*p.s);
      c.fill();
      // نص الإجابة
      if(p.s > .25){
        const fs = Math.max(10, 17*p.s);
        c.font = `bold ${fs}px sans-serif`;
        c.fillStyle="#fff";
        const bw = Math.min(gw*.96, c.measureText(q.a[ai]).width + 14);
        c.fillStyle = "rgba(45,35,80,.85)";
        c.beginPath();
        if(c.roundRect) c.roundRect(p.x-bw/2, p.y-gh/2-fs, bw, fs*1.7, 8); else c.rect(p.x-bw/2, p.y-gh/2-fs, bw, fs*1.7);
        c.fill();
        c.fillStyle="#fff";
        c.fillText(q.a[ai], p.x, p.y-gh/2+fs*.25);
      }
    });
  }
  // السؤال أعلى الشاشة
  if(q){
    c.fillStyle="rgba(93,63,163,.92)";
    c.beginPath();
    if(c.roundRect) c.roundRect(30, 12, W-60, 54, 16); else c.rect(30,12,W-60,54);
    c.fill();
    c.fillStyle="#fff"; c.font="bold 19px sans-serif";
    c.fillText(q.q, W/2, 45);
    // عداد المسافة للبوابة
    c.fillStyle="rgba(255,255,255,.3)";
    c.beginPath(); if(c.roundRect) c.roundRect(60, 56, W-120, 6, 3); else c.rect(60,56,W-120,6); c.fill();
    c.fillStyle="#ffd166";
    c.beginPath(); if(c.roundRect) c.roundRect(60, 56, (W-120)*(1-L.z), 6, 3); else c.rect(60,56,(W-120)*(1-L.z),6); c.fill();
  }
  // الشخصية من الخلف تركض
  const kx = VPX + L.side*118;
  drawKidBack(c, kx, 520, L.t*11, state.gender, 1.05);
  // الاسم
  c.font="bold 14px sans-serif";
  const nm = esc(state.name);
  const tw = c.measureText(nm).width + 16;
  c.fillStyle="rgba(255,255,255,.9)";
  c.beginPath();
  if(c.roundRect) c.roundRect(kx-tw/2, 430, tw, 22, 11); else c.rect(kx-tw/2, 430, tw, 22);
  c.fill();
  c.fillStyle="#5d3fa3"; c.fillText(nm, kx, 446);
}

/* ============================================================
   المرحلة 3: السوبرماركت — تحدي قائمة التسوق (ذاكرة)
   ============================================================ */
const MK_HEALTHY = [
  ["🥦","بروكلي"],["🍊","برتقال"],["🥛","حليب"],["🍞","خبز أسمر"],
  ["🍓","فراولة"],["🥚","بيض"],["🍎","تفاح"],["🥕","جزر"],
  ["💧","ماء"],["🍌","موز"],["🧀","جبن"],["🍇","عنب"],
];
const MK_JUNK = [
  ["🍫","شوكولاتة"],["🌭","نقانق"],["🍟","شيبس"],["🥤","غازي"],
  ["🍩","دونات"],["🍭","مصاصة"],
];
function mkStart(){ mkRound(0); }
function mkRound(round){
  stopLevel();
  const listSize = 4 + round;
  const pool = [...MK_HEALTHY].sort(()=>Math.random()-.5);
  const list = pool.slice(0, listSize);
  const otherHealthy = pool.slice(listSize, listSize + (12 - listSize - 4));
  const junk = [...MK_JUNK].sort(()=>Math.random()-.5).slice(0,4);
  const grid = [...list, ...otherHealthy, ...junk].sort(()=>Math.random()-.5);
  const prevHearts = L && L.type==="market-carry" ? L.hearts : (window.__mkCarry ? window.__mkCarry.hearts : 3);
  const carry = window.__mkCarry || { hearts:3, meter:50, score:0 };
  if(round === 0) window.__mkCarry = { hearts:3, meter:50, score:0 };
  const cur = window.__mkCarry;
  // شاشة حفظ القائمة
  render(`
    ${hudHtml(`🛒 الجولة ${round+1} / 3`)}
    <div class="center">
      <h2>📝 احفظ قائمة التسوق!</h2>
      <p class="muted">ستختفي القائمة بعد <span id="memT" style="font-weight:bold;color:var(--red)">7</span> ثوانٍ...</p>
      <div class="list-paper">
        ${list.map(x=>`<div class="li">${x[0]} ${x[1]}</div>`).join("")}
      </div>
    </div>
  `);
  L = {
    i:2, type:"market", active:true, timers:[],
    hearts:cur.hearts, meter:cur.meter, score:cur.score,
    round, list, grid, found:0, time:0,
  };
  updateHUD();
  let mem = 7;
  const iv = setInterval(()=>{
    if(!L || L.type!=="market" || L.round!==round){ clearInterval(iv); return; }
    mem--;
    const el = document.getElementById("memT");
    if(el) el.textContent = mem;
    if(mem <= 0){ clearInterval(iv); mkShelves(); }
  }, 1000);
  L.timers.push(iv);
}
function mkShelves(){
  const listSize = L.list.length;
  render(`
    ${hudHtml(`🛒 الجولة ${L.round+1} / 3 — <span id='foundEl'>0</span>/${listSize}`)}
    <p class="center muted" style="margin-bottom:4px">⏱ <span id="mkTime" style="font-weight:bold">${20+L.round*5}</span> ثانية — أين منتجات قائمتك؟</p>
    <div class="shelf-grid">
      ${L.grid.map((x,i)=>`
        <button class="shelf-item" id="sh${i}" onclick="mkPick(${i})">
          <span class="pe">${x[0]}</span><span class="pn">${x[1]}</span>
        </button>`).join("")}
    </div>
    <div class="cartbar" id="cart">🛒</div>
  `);
  updateHUD();
  L.time = 20 + L.round*5;
  const iv = setInterval(()=>{
    if(!L || L.type!=="market"){ clearInterval(iv); return; }
    L.time--;
    const el = document.getElementById("mkTime");
    if(el) el.textContent = L.time;
    if(L.time <= 0){
      clearInterval(iv);
      if(!loseHeart("انتهى وقت الجولة! أعدها من جديد")){
        const r = L.round;
        setTimeout(()=>{ if(L) mkRound(r); }, 1200);
      }
    }
  }, 1000);
  L.timers.push(iv);
}
function mkPick(i){
  if(!L || L.type!=="market") return;
  const item = L.grid[i];
  const el = document.getElementById("sh"+i);
  const inList = L.list.some(x=>x[0]===item[0]);
  const isJunk = MK_JUNK.some(x=>x[0]===item[0]);
  if(inList && el && !el.classList.contains("found")){
    el.classList.add("found");
    L.found++;
    gain(15, 6, `✅ ${item[0]} ${item[1]} — في القائمة!`);
    const f = document.getElementById("foundEl");
    if(f) f.textContent = L.found;
    const cart = document.getElementById("cart");
    if(cart) cart.innerHTML += " " + item[0];
    if(L.found >= L.list.length){
      const bonus = L.time * 3;
      L.score += bonus;
      window.__mkCarry = { hearts:L.hearts, meter:L.meter, score:L.score };
      const r = L.round;
      if(r >= 2){
        setTimeout(()=>{ if(L) completeLevel(`أكملت 3 قوائم تسوق صحية بذاكرة بطل! 🧠<br>مكافأة سرعة الجولة الأخيرة: <b>+${bonus}</b>`); }, 700);
      } else {
        toast(`🎉 أكملت الجولة ${r+1}! مكافأة السرعة +${bonus}`, "good", 1800);
        setTimeout(()=>{ if(L) mkRound(r+1); }, 1600);
      }
    }
  } else if(isJunk){
    if(el){ el.classList.add("wrong"); setTimeout(()=>el.classList.remove("wrong"), 400); }
    damage(16, `${item[0]} ${item[1]}! ليست في قائمتك الصحية!`);
  } else {
    if(el){ el.classList.add("wrong"); setTimeout(()=>el.classList.remove("wrong"), 400); }
    L.score = Math.max(0, L.score - 5);
    toast(`🤔 ${item[0]} صحي لكنه ليس في قائمتك!`, "", 1400);
    updateHUD();
  }
}

  `);
  L = {
    i:3, type:"park", active:true, timers:[],
    hearts:3, meter:50, score:0,
    dist:0, speed:230,
    ky:0, vy:0, onGround:true,
    objs:[], lastSpawn:0, spawnGap:1.35,
    sunTimer:8 + Math.random()*4, sunActive:false, sunLeft:0,
    inv:0, t:0, last:performance.now(),
    face:"happy", faceTimer:0,
  };
  const cv = document.getElementById("gc");
  cv.addEventListener("pointerdown", ()=>pkJump());
  document.getElementById("btnJ").addEventListener("pointerdown", e=>{e.preventDefault(); pkJump();});
  updateHUD();
  requestAnimationFrame(pkLoop);
}
function pkJump(){
  if(!L || L.type!=="park" || !L.active) return;
  if(L.onGround){
    L.vy = -640; L.onGround = false;
    soundJump();
  }
}
function pkSpawn(){
  const r = Math.random();
  if(r < .42){
    // عقبة أرضية
    const obs = [["🚬","سحابة دخان"],["🚧","حاجز"],["🪨","صخرة"]][Math.floor(Math.random()*3)];
    L.objs.push({kind:"obs", e:obs[0], label:obs[1], x:540, y:548});
  } else {
    // عنصر صحي: أرضي أو في الهواء (يتطلب قفزة)
    const its = [["💧","ماء"],["🍉","بطيخ"],["🍊","برتقال"],["🧢","قبعة"],["⚽","كرة"]];
    const it = its[Math.floor(Math.random()*its.length)];
    const air = Math.random() < .5;
    L.objs.push({kind:"good", e:it[0], label:it[1], x:540, y: air ? 455 : 545});
  }
}
function pkLoop(now){
  if(!L || L.type!=="park" || !L.active) return;
  const dt = Math.min(.05,(now-L.last)/1000); L.last = now; L.t += dt;
  L.dist += L.speed*dt;
  L.speed = Math.min(330, L.speed + dt*4);
  if(L.inv > 0) L.inv -= dt;
  if(L.faceTimer > 0){ L.faceTimer -= dt; if(L.faceTimer <= 0) L.face = "happy"; }
  const de = document.getElementById("distEl");
  if(de) de.textContent = Math.min(100, Math.round(L.dist/PK_GOAL*100));
  if(L.dist >= PK_GOAL){
    L.active = false;
    setTimeout(()=>{ if(L) completeLevel(`قطعت مسار الحديقة كاملاً جرياً وقفزاً! 🏃💨`); }, 400);
    return;
  }
  // فيزياء القفز
  if(!L.onGround){
    L.vy += 1650*dt;
    L.ky += L.vy*dt;
    if(L.ky >= 0){ L.ky = 0; L.vy = 0; L.onGround = true; }
  }
  // توليد
  L.lastSpawn += dt;
  if(L.lastSpawn > L.spawnGap){
    L.lastSpawn = 0;
    L.spawnGap = Math.max(.85, L.spawnGap - .015);
    pkSpawn();
  }
  // حدث الشمس
  if(!L.sunActive){
    L.sunTimer -= dt;
    if(L.sunTimer <= 0){
      L.sunActive = true; L.sunLeft = 2.6;
      const slot = document.getElementById("sunSlot");
      if(slot) slot.innerHTML = `<button class="sunbtn" onclick="pkSunscreen()">🧴 ضع واقي الشمس!</button>`;
      beep(880,.3,"sawtooth",.1);
    }
  } else {
    L.sunLeft -= dt;
    if(L.sunLeft <= 0){
      L.sunActive = false; L.sunTimer = 10 + Math.random()*5;
      const slot = document.getElementById("sunSlot");
      if(slot) slot.innerHTML = "";
      L.face = "sad"; L.faceTimer = 1;
      if(damage(20, "☀️ ضربة شمس! ضع الواقي فور ظهور الزر")) return;
    }
  }
  // تحريك العناصر والتصادم
  const kidX = 110, kidY = 545 + L.ky;
  for(let i=L.objs.length-1;i>=0;i--){
    const o = L.objs[i];
    o.x -= L.speed*dt;
    if(o.x < -40){ L.objs.splice(i,1); continue; }
    if(Math.abs(o.x - kidX) < 34 && Math.abs(o.y - kidY) < 46){
      L.objs.splice(i,1);
      if(o.kind === "good"){
        L.score += 10; L.meter = Math.min(100, L.meter+7);
        soundGood(); flash("g"); updateHUD();
      } else if(L.inv <= 0){
        L.inv = 1.1; L.face = "wow"; L.faceTimer = .9;
        if(damage(22, `${o.e} ${o.label}! اقفز فوق العقبات`)) return;
      }
    }
  }
  pkDraw(kidX, kidY);
  requestAnimationFrame(pkLoop);
}
function pkSunscreen(){
  if(!L || L.type!=="park" || !L.sunActive) return;
  L.sunActive = false; L.sunTimer = 10 + Math.random()*5;
  const slot = document.getElementById("sunSlot");
  if(slot) slot.innerHTML = "";
  gain(15, 5, "🧴 حماية ممتازة! جلدك بأمان");
}
function pkDraw(kidX, kidY){
  const cv = document.getElementById("gc");
  if(!cv){ L.active = false; return; }
  const c = cv.getContext("2d");
  const W=480,H=620;
  // سماء
  const sky = c.createLinearGradient(0,0,0,440);
  sky.addColorStop(0, L.sunActive ? "#ffd899" : "#8ecae6");
  sky.addColorStop(1, L.sunActive ? "#ffe8c2" : "#d8f3ff");
  c.fillStyle = sky; c.fillRect(0,0,W,440);
  // شمس
  const sunR = L.sunActive ? 46+Math.sin(L.t*10)*5 : 34;
  c.fillStyle = L.sunActive ? "#ff9500" : "#ffd166";
  c.beginPath(); c.arc(400,80,sunR,0,7); c.fill();
  if(L.sunActive){
    c.strokeStyle="rgba(255,120,0,.7)"; c.lineWidth=5;
    for(let i=0;i<10;i++){
      const a = i*Math.PI/5 + L.t*2;
      c.beginPath(); c.moveTo(400+Math.cos(a)*(sunR+8),80+Math.sin(a)*(sunR+8));
      c.lineTo(400+Math.cos(a)*(sunR+26),80+Math.sin(a)*(sunR+26)); c.stroke();
    }
  }
  // غيوم بطيئة
  c.fillStyle="rgba(255,255,255,.9)";
  [[.3,90,60],[.55,300,130],[.4,180,50]].forEach(([sp,cx,cy],i)=>{
    const gx = ((cx - L.dist*sp*.12) % (W+140) + W+140) % (W+140) - 70;
    c.beginPath(); c.arc(gx,cy,16,0,7); c.arc(gx+20,cy-6,20,0,7); c.arc(gx+42,cy,15,0,7); c.fill();
  });
  // أشجار بعيدة (باراللاكس بطيء)
  for(let k=0;k<4;k++){
    const tx = ((k*170 - L.dist*.35) % (W+180) + W+180) % (W+180) - 90;
    c.fillStyle="#74c69d";
    c.beginPath(); c.arc(tx,395,42,0,7); c.fill();
    c.fillStyle="#8d5a2b"; c.fillRect(tx-6,415,12,32);
  }
  // أشجار قريبة (أسرع)
  for(let k=0;k<3;k++){
    const tx = ((k*260 - L.dist*.7) % (W+240) + W+240) % (W+240) - 120;
    c.fillStyle="#2d9e46";
    c.beginPath(); c.arc(tx,380,58,0,7); c.arc(tx-38,410,38,0,7); c.arc(tx+38,410,38,0,7); c.fill();
    c.fillStyle="#8d5a2b"; c.fillRect(tx-9,420,18,50);
  }
  // أرض
  c.fillStyle="#8fd14f"; c.fillRect(0,440,W,H-440);
  c.fillStyle="#7bc043"; c.fillRect(0,570,W,50);
  // زهور متحركة مع الأرض
  c.font="20px serif"; c.textAlign="center";
  for(let k=0;k<5;k++){
    const fx = ((k*130 - L.dist) % (W+80) + W+80) % (W+80) - 40;
    c.fillText(["🌼","🌷","🌸","🌻","🌺"][k], fx, 600);
  }
  // خط الجري
  c.strokeStyle="rgba(255,255,255,.6)"; c.lineWidth=3; c.setLineDash([26,30]);
  c.lineDashOffset = L.dist % 56;
  c.beginPath(); c.moveTo(0,568); c.lineTo(W,568); c.stroke();
  c.setLineDash([]);
  // العناصر
  c.font="36px serif";
  L.objs.forEach(o=>{
    if(o.kind==="obs" && o.e==="🚬"){
      c.fillStyle="rgba(120,120,120,.5)";
      c.beginPath(); c.arc(o.x,o.y-16,24,0,7); c.arc(o.x-16,o.y-6,16,0,7); c.arc(o.x+16,o.y-6,16,0,7); c.fill();
    }
    c.fillText(o.e, o.x, o.y);
  });
  // شريط التقدم كمسار
  c.fillStyle="rgba(93,63,163,.2)";
  c.beginPath(); if(c.roundRect) c.roundRect(40, 20, W-80, 12, 6); else c.rect(40,20,W-80,12); c.fill();
  c.fillStyle="#7c5cbf";
  c.beginPath(); if(c.roundRect) c.roundRect(40, 20, (W-80)*Math.min(1,L.dist/PK_GOAL), 12, 6); else c.rect(40,20,(W-80)*Math.min(1,L.dist/PK_GOAL),12); c.fill();
  c.font="16px serif"; c.fillText("🏁", 40 + (W-80)*Math.min(1,L.dist/PK_GOAL), 16);
  // الشخصية (تومض عند المناعة المؤقتة)
  if(!(L.inv > 0 && Math.floor(L.t*10)%2===0)){
    drawKid(c, kidX, kidY, L.onGround ? L.t*12 : .8, state.gender, L.face);
  }
  // الاسم
  const nm = esc(state.name);
  c.font="bold 14px sans-serif";
  const tw = c.measureText(nm).width + 16;
  c.fillStyle="rgba(255,255,255,.9)";
  c.beginPath();
  if(c.roundRect) c.roundRect(kidX-tw/2, kidY-96, tw, 22, 11); else c.rect(kidX-tw/2, kidY-96, tw, 22);
  c.fill();
  c.fillStyle="#5d3fa3"; c.fillText(nm, kidX, kidY-80);
}

/* ============================================================
   المرحلة 5: مهرجان التوعية — اضرب الخرافة!
   ============================================================ */
const FS_MYTHS = [
  {t:"السرطان معدي!", fix:"لا يُعدي أبداً — العب وعانق صديقك بأمان! 🤗"},
  {t:"المرض ذنبه!", fix:"ليس ذنب أحد أبداً! 💜"},
  {t:"لا شفاء منه!", fix:"ملايين شُفوا وعادوا لحياتهم! 🌟"},
  {t:"ابتعدوا عنه!", fix:"المريض يحتاج قربنا ودعمنا! 🤝"},
  {t:"شعره لن يعود!", fix:"الشعر ينمو من جديد بعد العلاج! 💇"},
  {t:"لا تلمس أغراضه!", fix:"المشاركة آمنة تماماً! 🧸"},
];
const FS_HOPES = ["🎗️","💌","🌷","⭐","🎈"];
const FS_GOAL = 15;
function fsStart(){
  stopLevel();
  render(`
    ${hudHtml(`👻 <span id='bustEl'>0</span> / ${FS_GOAL}`)}
    <p class="center muted" style="margin-bottom:2px">اضرب الخرافات الداكنة 👻 — لا تلمس رسائل الأمل الوردية 💌</p>
    <div class="whack-grid">
      ${Array.from({length:9},(_,i)=>`
        <button class="hole" id="hole${i}" onclick="fsWhack(${i})">
          <span class="tent">🎪</span>
        </button>`).join("")}
    </div>
  `);
  L = {
    i:4, type:"fest", active:true, timers:[],
    hearts:3, meter:50, score:0,
    busted:0, interval:1150, upTime:1500, pops:{},
  };
  updateHUD();
  fsSchedule();
}
function fsSchedule(){
  if(!L || L.type!=="fest" || !L.active) return;
  const tm = setTimeout(()=>{ fsPop(); fsSchedule(); }, L.interval);
  L.timers.push(tm);
}
function fsPop(){
  if(!L || L.type!=="fest" || !L.active) return;
  const free = Array.from({length:9},(_,i)=>i).filter(i=>!L.pops[i]);
  if(!free.length) return;
  const i = free[Math.floor(Math.random()*free.length)];
  const isMyth = Math.random() < .62;
  const data = isMyth
    ? { myth:true, m: FS_MYTHS[Math.floor(Math.random()*FS_MYTHS.length)] }
    : { myth:false, e: FS_HOPES[Math.floor(Math.random()*FS_HOPES.length)] };
  L.pops[i] = data;
  const hole = document.getElementById("hole"+i);
  if(hole){
    hole.innerHTML = data.myth
      ? `<span class="popup myth"><span class="pe">👻</span><span class="pt">${data.m.t}</span></span>`
      : `<span class="popup hope"><span class="pe">${data.e}</span><span class="pt">أمل!</span></span>`;
  }
  const tm = setTimeout(()=>{
    if(!L || L.type!=="fest" || !L.pops[i]) return;
    const wasMyth = L.pops[i].myth;
    delete L.pops[i];
    const h = document.getElementById("hole"+i);
    if(h) h.innerHTML = `<span class="tent">🎪</span>`;
    if(wasMyth){
      // خرافة هربت
      damage(7, "👻 هربت خرافة! كن أسرع");
    }
  }, L.upTime);
  L.timers.push(tm);
  // تسريع تدريجي
  L.interval = Math.max(620, L.interval - 18);
  L.upTime = Math.max(950, L.upTime - 20);
}
function fsWhack(i){
  if(!L || L.type!=="fest" || !L.active) return;
  const p = L.pops[i];
  const hole = document.getElementById("hole"+i);
  if(!p){ return; }
  delete L.pops[i];
  if(hole) hole.innerHTML = `<span class="tent">${p.myth ? "💥" : "😢"}</span>`;
  setTimeout(()=>{ const h=document.getElementById("hole"+i); if(h && (!L || !L.pops || !L.pops[i])) h.innerHTML = `<span class="tent">🎪</span>`; }, 350);
  if(p.myth){
    L.busted++;
    soundWhack();
    gain(12, 5, `💥 <b>حطمت الخرافة!</b> الحقيقة: ${p.m.fix}`);
    const b = document.getElementById("bustEl");
    if(b) b.textContent = L.busted;
    if(L.busted >= FS_GOAL){
      L.active = false;
      setTimeout(()=>{ if(L) completeLevel(`حطمت <b>${FS_GOAL}</b> خرافة وأنقذت مهرجان التوعية! 🎪`); }, 600);
    }
  } else {
    damage(14, "💔 هذه رسالة أمل! لا نضرب الأمل أبداً");
  }
}

/* ================= الشهادة ================= */
function showCertificate(){
  stopLevel();
  const totalStars = state.stars.reduce((a,b)=>a+b,0);
  soundWin(); confetti();
  const fem = state.gender === "girl";
  render(`
    <div class="cert">
      <span style="font-size:2.8rem">🎗️🎓</span>
      <h2>شهادة بطل التوعية</h2>
      <p>تشهد لعبة <b>تفاؤل</b> بأن</p>
      <div class="name">${esc(state.name)} ${fem?"👧":"👦"} 🌟</div>
      <p>أكمل${fem?"ت":""} خمس مهمات مختلفة: استكشاف المنزل، وممر المدرسة ثلاثي الأبعاد،
      وتحدي السوبرماركت، وسباق الحديقة، وتحطيم الخرافات —
      وأصبح${fem?"ت":""} <b>سفير${fem?"ة":""} للأمل</b>!</p>
      <div class="stars">${"⭐".repeat(Math.min(totalStars,15))}</div>
      <p class="chip">🏆 النقاط: ${state.score} | النجوم: ${totalStars} / 15</p>
    </div>
    <div class="fact-box">
      🎗️ <b>رسالة البطل:</b> السرطان ليس معدياً، وليس ذنب أحد، والأمل موجود دائماً.
      عادات صحية + قلب داعم = بطل حقيقي! 💜
    </div>
    <div class="center">
      <button class="btn secondary" onclick="showMap()">🗺️ العودة للمسار</button>
      <button class="btn danger small" onclick="resetGame()">🔄 لعبة جديدة من البداية</button>
    </div>
  `);
}
function resetGame(){
  state.stars = [0,0,0,0,0];
  state.score = 0;
  saveState();
  showStart();
}

/* انطلق! */
loadState();
showStart();
</script>
