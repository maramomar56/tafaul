<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>تفاؤل — مغامرة الأبطال الصغار</title>
<style>
  :root{
    --purple:#7c5cbf;
    --purple-dark:#5d3fa3;
    --pink:#ff7eb3;
    --yellow:#ffd166;
    --green:#06d6a0;
    --red:#ef476f;
    --blue:#4cc9f0;
    --orange:#ff9f1c;
    --bg:#f6f2ff;
    --card:#ffffff;
    --text:#2d2350;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{
    font-family:"Segoe UI","Tahoma","Arial",sans-serif;
    background:linear-gradient(160deg,#e9defa 0%,#fbfcdb 100%);
    color:var(--text);
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:12px;
  }
  #app{
    width:100%;
    max-width:560px;
    background:var(--card);
    border-radius:28px;
    box-shadow:0 20px 60px rgba(93,63,163,.25);
    padding:20px 16px;
    position:relative;
    overflow:hidden;
  }
  h1{font-size:1.5rem;color:var(--purple-dark);margin-bottom:8px;}
  h2{font-size:1.2rem;color:var(--purple-dark);margin-bottom:10px;}
  p{line-height:1.9;font-size:1.02rem;}
  .center{text-align:center;}
  .big-emoji{font-size:3.6rem;display:block;margin:8px auto;animation:bounce 2s infinite;}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  @keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
  .pop{animation:pop .35s ease;}
  .btn{
    display:inline-block;
    border:none;cursor:pointer;
    font-family:inherit;font-size:1.05rem;font-weight:bold;color:#fff;
    background:linear-gradient(135deg,var(--purple),var(--pink));
    padding:13px 28px;border-radius:50px;
    box-shadow:0 6px 0 rgba(93,63,163,.35);
    transition:transform .12s, box-shadow .12s;
    margin:6px 4px;
  }
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(93,63,163,.35);}
  .btn.secondary{background:linear-gradient(135deg,var(--blue),var(--green));box-shadow:0 6px 0 rgba(6,150,120,.35);}
  .btn.danger{background:linear-gradient(135deg,var(--red),#ff8fa3);box-shadow:0 6px 0 rgba(180,40,70,.35);}
  .btn.small{font-size:.92rem;padding:9px 18px;}
  input[type=text]{
    width:100%;max-width:300px;
    padding:12px 18px;border-radius:50px;
    border:3px solid var(--purple);
    font-size:1.1rem;font-family:inherit;text-align:center;outline:none;
    margin:10px auto;display:block;
  }
  .chip{
    background:var(--bg);border-radius:50px;padding:5px 12px;
    font-weight:bold;font-size:.9rem;color:var(--purple-dark);
    display:inline-flex;align-items:center;gap:4px;
  }
  /* اختيار الشخصية */
  .char-pick{display:flex;gap:14px;justify-content:center;margin:12px 0;}
  .char-card{
    background:var(--bg);border:4px solid transparent;border-radius:22px;
    padding:10px 14px;cursor:pointer;text-align:center;transition:border .15s, transform .15s;
  }
  .char-card.sel{border-color:var(--green);transform:scale(1.06);background:#eafff7;}
  .char-card canvas{display:block;}
  .char-card span{font-weight:bold;font-size:.95rem;}
  /* خريطة المسار */
  .map-wrap{position:relative;margin:6px auto;max-width:440px;}
  .map-wrap svg{width:100%;height:auto;display:block;}
  .map-node{cursor:pointer;}
  .map-node.locked{cursor:default;opacity:.55;filter:grayscale(1);}
  .map-node circle.ring{transition:stroke .2s;}
  .map-node.playable circle.ring{animation:pulse 1.6s infinite;transform-origin:center;transform-box:fill-box;}
  /* شاشة اللعب */
  .hud{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;margin-bottom:6px;}
  #hearts{font-size:1.3rem;letter-spacing:2px;}
  .meter{
    position:relative;background:#e8e2f7;border-radius:50px;height:22px;
    overflow:hidden;margin:4px 0 8px;border:2px solid #d5cbef;
  }
  #meterFill{
    height:100%;width:50%;border-radius:50px;
    background:var(--green);
    transition:width .3s ease, background .3s ease;
  }
  .meter-label{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:.78rem;font-weight:bold;color:var(--text);pointer-events:none;
  }
  .game-wrap{position:relative;border-radius:18px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.15);}
  #gc{display:block;width:100%;height:auto;touch-action:manipulation;}
  #flash{position:absolute;inset:0;pointer-events:none;opacity:0;}
  #flash.g{background:radial-gradient(circle,transparent 40%,rgba(6,214,160,.5));animation:flashA .45s ease;}
  #flash.r{background:radial-gradient(circle,transparent 30%,rgba(239,71,111,.55));animation:flashA .45s ease;}
  @keyframes flashA{0%{opacity:1}100%{opacity:0}}
  .controls{display:flex;gap:10px;justify-content:center;margin-top:10px;direction:ltr;}
  .ctrl{
    flex:1;max-width:170px;
    font-size:1.7rem;padding:12px 0;border:none;border-radius:18px;cursor:pointer;
    background:linear-gradient(135deg,var(--purple),var(--pink));color:#fff;
    box-shadow:0 5px 0 rgba(93,63,163,.35);
    user-select:none;touch-action:manipulation;
  }
  .ctrl:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(93,63,163,.35);}
  .pausebtn{
    border:none;background:var(--bg);border-radius:50px;
    font-size:1rem;padding:5px 12px;cursor:pointer;font-weight:bold;color:var(--purple-dark);
  }
  /* أسئلة البوابة */
  .answer{
    display:block;width:100%;text-align:right;
    background:var(--bg);border:3px solid transparent;border-radius:18px;
    padding:13px 16px;font-size:1.02rem;font-family:inherit;font-weight:600;color:var(--text);
    cursor:pointer;margin-bottom:10px;transition:border .15s, background .15s;
  }
  .answer:hover{border-color:var(--purple);}
  .answer.correct{background:#d9f9ee;border-color:var(--green);}
  .answer.wrong{background:#ffe3ea;border-color:var(--red);animation:shake .35s ease;}
  .answer:disabled{cursor:default;opacity:.9;}
  .feedback{
    border-radius:18px;padding:13px 16px;margin:10px 0;
    font-size:.98rem;line-height:1.8;animation:pop .3s ease;
  }
  .feedback.good{background:#d9f9ee;border:2px solid var(--green);}
  .feedback.bad{background:#ffe3ea;border:2px solid var(--red);}
  .card-item{
    background:linear-gradient(135deg,#fff,var(--bg));
    border:3px solid var(--purple);border-radius:22px;
    padding:20px 16px;text-align:center;font-size:1.1rem;font-weight:bold;
    margin:12px 0;animation:pop .3s ease;
  }
  .card-item .emoji{font-size:2.8rem;display:block;margin-bottom:6px;}
  .fact-box{
    background:#fff8e1;border:2px dashed var(--yellow);border-radius:18px;
    padding:12px 16px;margin:12px 0;font-size:.98rem;line-height:1.8;text-align:right;
  }
  .stars{font-size:1.9rem;letter-spacing:4px;margin:8px 0;}
  .cert{
    border:6px double var(--purple);border-radius:22px;
    padding:22px 14px;background:linear-gradient(160deg,#fffdf5,#f3edff);
    text-align:center;margin:12px 0;
  }
  .cert .name{font-size:1.5rem;color:var(--pink);font-weight:bold;margin:8px 0;}
  #confetti{position:absolute;inset:0;pointer-events:none;z-index:5;}
  .muted{color:#8a80a8;font-size:.88rem;}
  .heart{color:var(--red);}
  .legend{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0;}
  .legend .chip{font-size:.85rem;}
</style>
</head>
<body>
<div id="app">
  <canvas id="confetti"></canvas>
  <div id="screen"></div>
</div>

<script>
"use strict";

/* ================= الحالة العامة والحفظ ================= */
const state = {
  name: "",
  gender: "boy",       // boy أو girl
  stars: [0,0,0,0,0],  // نجوم المراحل الخمس
  score: 0,
};
function saveState(){
  try{ localStorage.setItem("tafaul-save", JSON.stringify(state)); }catch(e){}
}
function loadState(){
  try{
    const s = JSON.parse(localStorage.getItem("tafaul-save"));
    if(s && typeof s === "object"){
      state.name = s.name || "";
      state.gender = s.gender === "girl" ? "girl" : "boy";
      if(Array.isArray(s.stars) && s.stars.length === 5) state.stars = s.stars.map(n=>+n||0);
      state.score = +s.score || 0;
    }
  }catch(e){}
}
function esc(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

const screen = document.getElementById("screen");
function render(html){
  screen.innerHTML = html;
  screen.classList.remove("pop"); void screen.offsetWidth; screen.classList.add("pop");
  window.scrollTo(0,0);
}
function starsOf(n){ return "⭐".repeat(n) + "☆".repeat(Math.max(0,3-n)); }

/* ================= أصوات ================= */
let audioCtx = null;
function beep(freq, dur=0.15, type="sine", vol=0.14){
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}
const soundGood = () => { beep(660,.1); setTimeout(()=>beep(880,.15),90); };
const soundBad  = () => beep(170,.28,"square");
const soundHurt = () => { beep(200,.15,"square"); setTimeout(()=>beep(130,.3,"square"),120); };
const soundWin  = () => [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.2),i*140));

/* ================= قصاصات الاحتفال ================= */
function confetti(){
  const c = document.getElementById("confetti");
  c.width = c.offsetWidth; c.height = c.offsetHeight;
  const x = c.getContext("2d");
  const colors = ["#ff7eb3","#ffd166","#06d6a0","#4cc9f0","#7c5cbf"];
  const parts = Array.from({length:90},()=>({
    x:Math.random()*c.width, y:-20-Math.random()*c.height*.5,
    r:4+Math.random()*6, vy:2+Math.random()*3, vx:-1+Math.random()*2,
    color:colors[Math.floor(Math.random()*colors.length)], rot:Math.random()*Math.PI
  }));
  let fr = 0;
  (function draw(){
    x.clearRect(0,0,c.width,c.height);
    parts.forEach(p=>{
      p.y+=p.vy; p.x+=p.vx; p.rot+=.05;
      x.save(); x.translate(p.x,p.y); x.rotate(p.rot);
      x.fillStyle=p.color; x.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6); x.restore();
    });
    if(++fr<160) requestAnimationFrame(draw);
    else x.clearRect(0,0,c.width,c.height);
  })();
}

/* ================= رسم الشخصية ================= */
function drawKid(c, x, y, ph, gender, face, scale=1){
  const swing = Math.sin(ph);
  c.save(); c.translate(x,y); c.scale(scale,scale);
  // الظل
  c.fillStyle = "rgba(0,0,0,.16)";
  c.beginPath(); c.ellipse(0,56,26,7,0,0,7); c.fill();
  // الساقان
  c.strokeStyle = "#3b5bdb"; c.lineWidth = 10; c.lineCap = "round";
  c.beginPath(); c.moveTo(-8,18); c.lineTo(-8+swing*9,48); c.stroke();
  c.beginPath(); c.moveTo(8,18); c.lineTo(8-swing*9,48); c.stroke();
  // الحذاء
  c.fillStyle = "#22223b";
  c.beginPath(); c.ellipse(-8+swing*9,51,8,4.5,0,0,7); c.fill();
  c.beginPath(); c.ellipse(8-swing*9,51,8,4.5,0,0,7); c.fill();
  // الذراعان
  const shirt = gender==="girl" ? "#ff7eb3" : "#06d6a0";
  c.strokeStyle = shirt; c.lineWidth = 8;
  c.beginPath(); c.moveTo(-13,-6); c.lineTo(-21-swing*6,14); c.stroke();
  c.beginPath(); c.moveTo(13,-6); c.lineTo(21+swing*6,14); c.stroke();
  // اليدان
  c.fillStyle = "#ffd9b3";
  c.beginPath(); c.arc(-21-swing*6,16,4.5,0,7); c.fill();
  c.beginPath(); c.arc(21+swing*6,16,4.5,0,7); c.fill();
  // الجسم
  c.fillStyle = shirt;
  c.beginPath();
  if(c.roundRect) c.roundRect(-16,-14,32,36,10); else c.rect(-16,-14,32,36);
  c.fill();
  if(gender==="girl"){ // تنورة
    c.beginPath(); c.moveTo(-16,14); c.lineTo(16,14); c.lineTo(22,26); c.lineTo(-22,26); c.closePath();
    c.fillStyle = "#e0509b"; c.fill();
  }
  // شارة التوعية على الصدر
  c.fillStyle = "#ffd166"; c.font = "11px serif"; c.textAlign="center";
  c.fillText("🎗️", 0, 2);
  // الرأس
  c.fillStyle = "#ffd9b3";
  c.beginPath(); c.arc(0,-34,20,0,7); c.fill();
  // الشعر
  c.fillStyle = "#4a3728";
  if(gender==="girl"){
    c.beginPath(); c.arc(0,-38,21,Math.PI*0.9,Math.PI*2.1); c.fill();
    c.beginPath();
    if(c.roundRect){ c.roundRect(-24,-42,9,32,4); c.roundRect(15,-42,9,32,4); }
    else { c.rect(-24,-42,9,32); c.rect(15,-42,9,32); }
    c.fill();
    // فيونكة
    c.fillStyle = "#ff4f9a";
    c.beginPath(); c.moveTo(10,-52); c.lineTo(20,-58); c.lineTo(20,-46); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(10,-52); c.lineTo(2,-58); c.lineTo(2,-46); c.closePath(); c.fill();
    c.beginPath(); c.arc(10,-52,3,0,7); c.fill();
  } else {
    c.beginPath(); c.arc(0,-40,20,Math.PI,Math.PI*2); c.fill();
    c.beginPath(); c.arc(-14,-38,6,0,7); c.arc(14,-38,6,0,7); c.fill();
  }
  // العينان
  c.fillStyle = "#2d2350";
  if(face==="wow"){
    c.beginPath(); c.arc(-7,-36,3.4,0,7); c.arc(7,-36,3.4,0,7); c.fill();
  } else {
    c.beginPath(); c.arc(-7,-36,2.6,0,7); c.arc(7,-36,2.6,0,7); c.fill();
  }
  // الخدود
  c.fillStyle = "rgba(255,126,179,.5)";
  c.beginPath(); c.arc(-13,-29,3.4,0,7); c.arc(13,-29,3.4,0,7); c.fill();
  // الفم
  c.strokeStyle = "#c1445f"; c.lineWidth = 2.4; c.lineCap="round";
  c.beginPath();
  if(face==="sad")      c.arc(0,-22,6,Math.PI*1.15,Math.PI*1.85);
  else if(face==="wow"){ c.fillStyle="#c1445f"; c.arc(0,-25,4,0,7); c.fill(); }
  else                  c.arc(0,-30,7,Math.PI*0.15,Math.PI*0.85);
  if(face!=="wow") c.stroke();
  c.restore();
}

/* ================= خلفيات البيئات ================= */
function bgHome(c,W,H,t){
  c.fillStyle="#ffe9d6"; c.fillRect(0,0,W,H*.72);            // جدار
  c.fillStyle="#e8b88a"; c.fillRect(0,H*.72,W,H*.28);        // أرضية
  // نافذة
  c.fillStyle="#bde0fe"; c.fillRect(W*.62,60,130,110);
  c.strokeStyle="#8f6a48"; c.lineWidth=8; c.strokeRect(W*.62,60,130,110);
  c.beginPath(); c.moveTo(W*.62+65,60); c.lineTo(W*.62+65,170); c.stroke();
  c.fillStyle="#fff"; // غيمة خلف النافذة
  c.beginPath(); c.arc(W*.62+35+Math.sin(t/2)*10,95,14,0,7); c.arc(W*.62+55+Math.sin(t/2)*10,90,17,0,7); c.arc(W*.62+75+Math.sin(t/2)*10,96,13,0,7); c.fill();
  // ستارة
  c.fillStyle="#ff9eb5"; c.fillRect(W*.60,52,18,126); c.fillRect(W*.62+124,52,18,126);
  // لوحة عائلية
  c.fillStyle="#fff"; c.fillRect(70,70,86,70);
  c.strokeStyle="#c19a6b"; c.lineWidth=6; c.strokeRect(70,70,86,70);
  c.font="34px serif"; c.textAlign="center"; c.fillText("👨‍👩‍👧‍👦",113,118);
  // كنبة
  c.fillStyle="#7c5cbf";
  c.beginPath(); if(c.roundRect) c.roundRect(30,H*.55,150,70,16); else c.rect(30,H*.55,150,70); c.fill();
  c.fillStyle="#9d7fe0";
  c.beginPath(); if(c.roundRect) c.roundRect(40,H*.51,55,34,10); else c.rect(40,H*.51,55,34); c.fill();
  c.beginPath(); if(c.roundRect) c.roundRect(115,H*.51,55,34,10); else c.rect(115,H*.51,55,34); c.fill();
  // نبتة
  c.fillStyle="#b5651d"; c.fillRect(W-70,H*.60,34,40);
  c.font="44px serif"; c.fillText("🪴",W-52,H*.62);
}
function bgSchool(c,W,H,t){
  c.fillStyle="#fdf6e3"; c.fillRect(0,0,W,H*.72);
  c.fillStyle="#c8b6e2"; c.fillRect(0,H*.72,W,H*.28);
  // سبورة
  c.fillStyle="#2e6e4e"; c.fillRect(W*.28,55,W*.44,120);
  c.strokeStyle="#b5651d"; c.lineWidth=8; c.strokeRect(W*.28,55,W*.44,120);
  c.fillStyle="#fff"; c.font="bold 26px sans-serif"; c.textAlign="center";
  c.fillText("أهلاً أبطال!", W*.5, 105);
  c.font="20px serif"; c.fillText("🎗️ + 📚 = 💪", W*.5, 145);
  // ساعة
  c.fillStyle="#fff"; c.beginPath(); c.arc(90,90,26,0,7); c.fill();
  c.strokeStyle="#5d3fa3"; c.lineWidth=4; c.stroke();
  c.beginPath(); c.moveTo(90,90); c.lineTo(90,74); c.moveTo(90,90); c.lineTo(102,90); c.lineWidth=3; c.stroke();
  // حقائب على الجدار
  c.font="34px serif"; c.fillText("🎒",W-60,120); c.fillText("🎒",W-110,120);
  // خزانة كتب
  c.fillStyle="#b5651d"; c.fillRect(20,H*.46,90,110);
  c.font="22px serif"; c.fillText("📕📗",65,H*.46+38); c.fillText("📘📙",65,H*.46+78);
}
function bgMarket(c,W,H,t){
  c.fillStyle="#e3f2fd"; c.fillRect(0,0,W,H*.72);
  c.fillStyle="#b0bec5"; c.fillRect(0,H*.72,W,H*.28);
  // لافتة
  c.fillStyle="#06d6a0";
  c.beginPath(); if(c.roundRect) c.roundRect(W*.2,40,W*.6,54,14); else c.rect(W*.2,40,W*.6,54); c.fill();
  c.fillStyle="#fff"; c.font="bold 26px sans-serif"; c.textAlign="center";
  c.fillText("🛒 سوبرماركت الصحة", W*.5, 75);
  // رفوف
  for(let r=0;r<2;r++){
    const y = 130 + r*95;
    c.fillStyle="#d7ccc8"; c.fillRect(30,y,W-60,66);
    c.fillStyle="#a1887f"; c.fillRect(30,y+66,W-60,10);
    c.font="30px serif";
    const goods = r===0 ? ["🍎","🥦","🍊","🥛","🍞","🍓"] : ["🥚","🥕","🍌","🧀","🍇","💧"];
    goods.forEach((g,i)=> c.fillText(g, 70+i*((W-130)/5), y+45));
  }
}
function bgPark(c,W,H,t){
  const sky = c.createLinearGradient(0,0,0,H*.72);
  sky.addColorStop(0,"#8ecae6"); sky.addColorStop(1,"#cdeffd");
  c.fillStyle=sky; c.fillRect(0,0,W,H*.72);
  c.fillStyle="#8fd14f"; c.fillRect(0,H*.72,W,H*.28);
  // شمس
  c.fillStyle="#ffd166"; c.beginPath(); c.arc(W-80,80,34,0,7); c.fill();
  c.strokeStyle="#ffd166"; c.lineWidth=4;
  for(let i=0;i<8;i++){
    const a = i*Math.PI/4 + t*.3;
    c.beginPath(); c.moveTo(W-80+Math.cos(a)*42,80+Math.sin(a)*42);
    c.lineTo(W-80+Math.cos(a)*54,80+Math.sin(a)*54); c.stroke();
  }
  // غيوم
  c.fillStyle="#fff";
  [[100,70],[240,110]].forEach(([gx,gy],i)=>{
    const dx = Math.sin(t/3+i)*14;
    c.beginPath(); c.arc(gx+dx,gy,16,0,7); c.arc(gx+22+dx,gy-6,19,0,7); c.arc(gx+44+dx,gy,15,0,7); c.fill();
  });
  // أشجار
  [[60,H*.58],[W-70,H*.60]].forEach(([tx,ty])=>{
    c.fillStyle="#8d5a2b"; c.fillRect(tx-8,ty,16,54);
    c.fillStyle="#2d9e46";
    c.beginPath(); c.arc(tx,ty-18,34,0,7); c.arc(tx-24,ty+2,24,0,7); c.arc(tx+24,ty+2,24,0,7); c.fill();
  });
  // زهور
  c.font="22px serif"; c.textAlign="center";
  ["🌷","🌼","🌸","🌻"].forEach((f,i)=> c.fillText(f, 50+i*((W-100)/3), H*.78));
}
function bgFest(c,W,H,t){
  const sky = c.createLinearGradient(0,0,0,H*.72);
  sky.addColorStop(0,"#c8b6ff"); sky.addColorStop(1,"#ffd6e8");
  c.fillStyle=sky; c.fillRect(0,0,W,H*.72);
  c.fillStyle="#e0aaff"; c.fillRect(0,H*.72,W,H*.28);
  // لافتة المهرجان
  c.strokeStyle="#7c5cbf"; c.lineWidth=5;
  c.beginPath(); c.moveTo(20,60); c.quadraticCurveTo(W/2,110,W-20,60); c.stroke();
  const flagColors=["#ff7eb3","#ffd166","#06d6a0","#4cc9f0","#ef476f","#7c5cbf","#ff9f1c"];
  for(let i=0;i<7;i++){
    const fx = 40 + i*(W-80)/6;
    const fy = 60 + Math.sin((fx/W)*Math.PI)*46;
    c.fillStyle=flagColors[i];
    c.beginPath(); c.moveTo(fx-13,fy); c.lineTo(fx+13,fy); c.lineTo(fx,fy+26); c.closePath(); c.fill();
  }
  c.fillStyle="#5d3fa3"; c.font="bold 24px sans-serif"; c.textAlign="center";
  c.fillText("🎗️ مهرجان الأمل والتوعية 🎗️", W/2, 150);
  // بالونات
  c.font="40px serif";
  [[70,220],[W-70,200],[W/2,190]].forEach(([bx,by],i)=>{
    c.fillText("🎈", bx, by + Math.sin(t*1.2+i*2)*10);
  });
  // خيمة
  c.fillStyle="#ff7eb3";
  c.beginPath(); c.moveTo(40,H*.66); c.lineTo(110,H*.44); c.lineTo(180,H*.66); c.closePath(); c.fill();
  c.fillStyle="#fff"; c.fillRect(95,H*.56,30,H*.10);
}

const NODE_POS = [[330,455],[85,365],[320,272],[85,182],[320,95]];
function isUnlocked(i){ return i===0 || state.stars[i-1] > 0; }
function allDone(){ return state.stars.every(s=>s>0); }

function showMap(){
  const nodes = WORLDS.map((w,i)=>{
    const [x,y] = NODE_POS[i];
    const unlocked = isUnlocked(i);

    const cls = unlocked ? (done ? "map-node done" : "map-node playable") : "map-node locked";

      <g class="${cls}" ${unlocked?`onclick="showIntro(${i})"`:""}>

        ${done?`<text x="${x}" y="${y-44}" text-anchor="middle" font-size="15">${"⭐".repeat(state.stars[i])}</text>`:""}

/* ================= محرك اللعب ================= */
const LANES = [120,240,360];
const KID_Y = 580;
let game = null;

function beginPlay(i){
  const w = WORLDS[i];
  render(`
    <div class="hud">
      <span id="hearts">❤️❤️❤️</span>
      <span class="chip">${w.icon} <span id="prog">0 / ${w.goal}</span></span>
      <span class="chip">🏆 <span id="scoreEl">0</span></span>
      <button class="pausebtn" onclick="togglePause()" id="pauseBtn">⏸</button>
    </div>
    <div class="meter">
      <div id="meterFill"></div>
      <span class="meter-label">مؤشر الصحة 💚</span>
    </div>
    <div class="game-wrap">
      <canvas id="gc" width="480" height="720"></canvas>
      <div id="flash"></div>
    </div>
    <div class="controls">
      <button class="ctrl" id="btnL">◀</button>
      <button class="ctrl" id="btnR">▶</button>
    </div>
  `);
  game = {
    idx:i, w, lane:1, x:LANES[1],
    hearts:3, meter:50, collected:0, score:0,
    items:[], floats:[], t:0, lastSpawn:0,
    running:true, paused:false, over:false,
    ph:0, face:"happy", faceTimer:0,
    groundOff:0, shake:0, last:performance.now(),
  };
  const cv = document.getElementById("gc");
  cv.addEventListener("pointerdown", e=>{
    const r = cv.getBoundingClientRect();
    moveKid((e.clientX - r.left) / r.width < .5 ? -1 : 1);
  });
  document.getElementById("btnL").addEventListener("pointerdown", e=>{e.preventDefault();moveKid(-1);});
  document.getElementById("btnR").addEventListener("pointerdown", e=>{e.preventDefault();moveKid(1);});
  updateHUD();
  requestAnimationFrame(loop);
}
document.addEventListener("keydown", e=>{
  if(!game || !game.running) return;
  if(e.key==="ArrowLeft"){ moveKid(-1); e.preventDefault(); }
  if(e.key==="ArrowRight"){ moveKid(1); e.preventDefault(); }
});
function moveKid(dir){
  if(!game || !game.running || game.paused) return;
  game.lane = Math.max(0, Math.min(2, game.lane + dir));
  beep(440,.05,"triangle",.06);
}
function togglePause(){
  if(!game || !game.running) return;
  game.paused = !game.paused;
  const b = document.getElementById("pauseBtn");
  if(b) b.textContent = game.paused ? "▶" : "⏸";
}

function spawnItem(){
  const w = game.w;
  const r = Math.random();
  let it;
  if(r < w.hazardChance){
    it = { e:w.hazard[0], label:w.hazard[1], kind:"hazard" };
  } else if(r < w.hazardChance + .36){
    const b = w.bad[Math.floor(Math.random()*w.bad.length)];
    it = { e:b[0], label:b[1], kind:"bad" };
  } else {
    const g = w.good[Math.floor(Math.random()*w.good.length)];
    it = { e:g[0], label:g[1], kind:"good" };
  }
  game.items.push({ ...it, lane:Math.floor(Math.random()*3), y:-40, wob:Math.random()*6 });
}

function updateHUD(){
  const h = document.getElementById("hearts");
  if(h) h.textContent = "❤️".repeat(game.hearts) + "🤍".repeat(3-game.hearts);
  const p = document.getElementById("prog");
  if(p) p.textContent = `${game.collected} / ${game.w.goal}`;
  const s = document.getElementById("scoreEl");
  if(s) s.textContent = game.score;
  const m = document.getElementById("meterFill");
  if(m){
    m.style.width = game.meter + "%";
    m.style.background = game.meter > 60 ? "linear-gradient(90deg,#06d6a0,#4cc9f0)"
                       : game.meter > 30 ? "linear-gradient(90deg,#ff9f1c,#ffd166)"
                       : "linear-gradient(90deg,#ef476f,#ff8fa3)";
  }
}
function flash(cls){
  const f = document.getElementById("flash");
  if(!f) return;
  f.className = ""; void f.offsetWidth; f.className = cls;
}

function hitItem(it){
  if(it.kind === "good"){
    game.collected++; game.score += 10;
    game.meter = Math.min(100, game.meter + 9);
    game.face = "happy";
    game.floats.push({x:LANES[it.lane], y:KID_Y-80, txt:`${it.e} ${it.label} +10`, color:"#06d6a0", life:1});
    flash("g"); soundGood();
  } else if(it.kind === "bad"){
    game.meter -= 16; game.score = Math.max(0, game.score - 5);
    game.face = "sad"; game.faceTimer = .9; game.shake = 8;
    game.floats.push({x:LANES[it.lane], y:KID_Y-80, txt:`${it.e} ${it.label}!`, color:"#ef476f", life:1});
    flash("r"); soundBad();
  } else { // عقبة
    game.hearts--; game.meter -= 10;
    game.face = "wow"; game.faceTimer = 1; game.shake = 14;
    game.floats.push({x:LANES[it.lane], y:KID_Y-90, txt:`⚠️ ${it.label} -❤️`, color:"#ef476f", life:1.4});
    flash("r"); soundHurt();
  }
  if(game.meter <= 0){
    game.hearts--; game.meter = 45;
    game.floats.push({x:240, y:300, txt:"💔 انخفض مؤشر الصحة كثيراً!", color:"#ef476f", life:1.5});
    soundHurt();
  }
  game.meter = Math.max(0, Math.min(100, game.meter));
  updateHUD();
  if(game.hearts <= 0){ endPlay(false); return; }
  if(game.collected >= game.w.goal){ endPlay(true); }
}

function endPlay(success){
  game.running = false;
  setTimeout(()=> success ? showGate(0) : showFail(), 450);
}

function loop(now){
  if(!game || !game.running){ return; }
  const dt = Math.min(.05, (now - game.last)/1000);
  game.last = now;
  const c = document.getElementById("gc");
  if(!c){ game.running = false; return; }
  const x = c.getContext("2d");
  const W = c.width, H = c.height;

  if(!game.paused){
    game.t += dt;
    game.ph += dt*9;
    game.groundOff = (game.groundOff + dt*140) % 60;
    if(game.faceTimer > 0){ game.faceTimer -= dt; if(game.faceTimer<=0) game.face="happy"; }
    if(game.shake > 0) game.shake = Math.max(0, game.shake - dt*40);
    // توليد العناصر
    if((game.t*1000 - game.lastSpawn) > game.w.spawnMs){
      game.lastSpawn = game.t*1000;
      spawnItem();
    }
    // تحريك الشخصية
    game.x += (LANES[game.lane] - game.x) * Math.min(1, dt*14);
    // تحريك العناصر والتصادم
    for(let i=game.items.length-1; i>=0; i--){
      const it = game.items[i];
      it.y += game.w.fallSpeed * dt;
      if(it.y > KID_Y-45 && it.y < KID_Y+35 && it.lane === game.lane){
        game.items.splice(i,1);
        hitItem(it);
        if(!game.running) return;
      } else if(it.y > H+40){
        game.items.splice(i,1);
      }
    }
    // النصوص الطائرة
    for(let i=game.floats.length-1; i>=0; i--){
      const f = game.floats[i];
      f.y -= dt*45; f.life -= dt;
      if(f.life <= 0) game.floats.splice(i,1);
    }
  }

  /* ---- الرسم ---- */
  x.save();
  if(game.shake > 0) x.translate((Math.random()-.5)*game.shake, (Math.random()-.5)*game.shake);
  game.w.bg(x, W, H, game.t);
  // ممر المشي مع خطوط متحركة
  x.fillStyle = "rgba(255,255,255,.25)";
  x.fillRect(60, 500, W-120, 180);
  x.strokeStyle = "rgba(93,63,163,.25)"; x.lineWidth = 3; x.setLineDash([18,42]);
  x.lineDashOffset = game.groundOff;
  [180,300].forEach(lx=>{ x.beginPath(); x.moveTo(lx,500); x.lineTo(lx,H); x.stroke(); });
  x.setLineDash([]);
  // العناصر
  x.textAlign = "center";
  game.items.forEach(it=>{
    const ix = LANES[it.lane] + Math.sin((it.y+it.wob*40)/34)*7;
    if(it.kind === "hazard"){
      x.fillStyle = `rgba(239,71,111,${.28 + Math.sin(game.t*7)*.14})`;
      x.beginPath(); x.arc(ix, it.y-13, 32, 0, 7); x.fill();
    }
    x.font = "40px serif";
    x.fillStyle = "#000";
    x.fillText(it.e, ix, it.y);
  });
  // الشخصية واسمها
  drawKid(x, game.x, KID_Y, game.paused ? 0 : game.ph, state.gender, game.face);
  const nm = esc(state.name);
  x.font = "bold 15px sans-serif";
  const tw = x.measureText(nm).width + 18;
  x.fillStyle = "rgba(255,255,255,.9)";
  x.beginPath();
  if(x.roundRect) x.roundRect(game.x-tw/2, KID_Y-92, tw, 24, 12); else x.rect(game.x-tw/2, KID_Y-92, tw, 24);
  x.fill();
  x.fillStyle = "#5d3fa3"; x.fillText(nm, game.x, KID_Y-75);
  // النصوص الطائرة
  game.floats.forEach(f=>{
    x.globalAlpha = Math.max(0, Math.min(1, f.life));
    x.font = "bold 19px sans-serif";
    x.strokeStyle = "#fff"; x.lineWidth = 4; x.strokeText(f.txt, f.x, f.y);
    x.fillStyle = f.color; x.fillText(f.txt, f.x, f.y);
    x.globalAlpha = 1;
  });
  if(game.paused){
    x.fillStyle = "rgba(45,35,80,.55)"; x.fillRect(0,0,W,H);
    x.fillStyle = "#fff"; x.font = "bold 38px sans-serif";
    x.fillText("⏸ استراحة", W/2, H/2);
  }
  x.restore();

  requestAnimationFrame(loop);
}

/* ================= سؤال البوابة ================= */
function showGate(qi){
  const w = game.w;
  const q = w.gate[qi];
  render(`
    <div class="center"><h2>🚧 بوابة المعرفة ${qi+1} / ${w.gate.length}</h2>
    <p class="muted">أجب لتفتح البوابة وتحصل على نقاط إضافية!</p></div>
    <div class="card-item"><span class="emoji">🗝️</span>${q.q}</div>
    <div id="answers">
      ${q.a.map((ans,ai)=>`<button class="answer" onclick="answerGate(${qi},${ai})">${["🅰️","🅱️","🅾️"][ai]} ${ans}</button>`).join("")}
    </div>
    <div id="fb"></div>
  `);
}
function answerGate(qi, ai){
  const w = game.w;
  const q = w.gate[qi];
  const btns = document.querySelectorAll(".answer");
  btns.forEach(b=>b.disabled = true);
  btns[q.correct].classList.add("correct");
  const good = ai === q.correct;
  if(good){ game.score += 25; soundGood(); }
  else { btns[ai].classList.add("wrong"); soundBad(); }
  document.getElementById("fb").innerHTML = `
    <div class="feedback ${good?"good":"bad"}">
      <b>${good ? "🗝️ فُتحت البوابة! +25" : "😊 لا بأس، تعلمنا معلومة جديدة!"}</b><br>${q.why}
    </div>
    <div class="center"><button class="btn small" onclick="${qi < w.gate.length-1 ? `showGate(${qi+1})` : "finishLevel()"}">
      ${qi < w.gate.length-1 ? "البوابة التالية ➡️" : "🏁 أكمل المهمة"}
    </button></div>`;
}

/* ================= نهاية المرحلة ================= */
function finishLevel(){
  const i = game.idx;
  const stars = Math.max(1, game.hearts);
  state.stars[i] = Math.max(state.stars[i], stars);
  state.score += game.score;
  saveState();
  soundWin(); confetti();
  const next = i < WORLDS.length-1 ? i+1 : null;
  render(`
    <div class="center">
      <span class="big-emoji">${stars===3?"🏆":stars===2?"🎉":"💪"}</span>
      <h2>أنهيت مهمة ${WORLDS[i].name}!</h2>
      <div class="stars">${starsOf(stars)}</div>
      <p>جمعت <b>${game.collected}</b> عنصراً صحياً وحصلت على <b>${game.score}</b> نقطة،
      وبقي لديك <b>${game.hearts}</b> ${game.hearts===1?"قلب":"قلوب"} ${"❤️".repeat(game.hearts)}</p>
      ${stars<3?`<p class="muted">حافظ على قلوبك الثلاثة لتحصل على ٣ نجوم! ⭐⭐⭐</p>`:`<p class="muted">مهمة مثالية بدون خسارة أي قلب! 🌟</p>`}
      <div class="fact-box">💡 <b>تذكّر:</b> ${WORLDS[i].tip}</div>
      ${next!==null
        ? `<button class="btn" onclick="showIntro(${next})">➡️ المكان التالي: ${WORLDS[next].icon} ${WORLDS[next].name}</button>`
        : `<button class="btn" onclick="showCertificate()">🎓 استلم شهادتك!</button>`}
      <button class="btn small secondary" onclick="showMap()">🗺️ المسار</button>
      <button class="btn small secondary" onclick="beginPlay(${i})">🔁 إعادة</button>
    </div>
  `);
  game = null;
}
function showFail(){
  const i = game.idx;
  render(`
    <div class="center">
      <span class="big-emoji">💔</span>
      <h2>نفدت القلوب!</h2>
      <p>لا بأس يا ${esc(state.name)}، كل بطل يتعثر ثم ينهض أقوى! 💪</p>
      <div class="fact-box">💡 <b>نصيحة:</b> ركّز على العناصر الصحية ${WORLDS[i].good.slice(0,3).map(g=>g[0]).join(" ")}
      وابتعد عن العقبة ${WORLDS[i].hazard[0]} فهي تخسرك قلباً كاملاً!</div>
      <button class="btn" onclick="beginPlay(${i})">🔁 حاول مرة أخرى</button>
      <button class="btn small secondary" onclick="showMap()">🗺️ المسار</button>
    </div>
  `);
  game = null;
}

/* ================= الشهادة ================= */
function showCertificate(){
  const totalStars = state.stars.reduce((a,b)=>a+b,0);
  soundWin(); confetti();
  render(`
    <div class="cert">
      <span style="font-size:2.8rem">🎗️🎓</span>
      <h2>شهادة بطل التوعية</h2>
      <p>تشهد لعبة <b>تفاؤل</b> بأن</p>
      <div class="name">${esc(state.name)} ${state.gender==="girl"?"👧":"👦"} 🌟</div>
      <p>أكمل${state.gender==="girl"?"ت":""} مغامرة الأبطال الصغار في المنزل والمدرسة والسوبرماركت والحديقة ومهرجان التوعية،
      وأصبح${state.gender==="girl"?"ت":""} <b>سفير${state.gender==="girl"?"ة":""} للأمل</b>!</p>
      <div class="stars">${"⭐".repeat(Math.min(totalStars,15))}</div>
      <p class="chip">🏆 النقاط: ${state.score} | النجوم: ${totalStars} / 15</p>
    </div>
    <div class="fact-box">
      🎗️ <b>رسالة البطل:</b> السرطان ليس معدياً، وليس ذنب أحد، والأمل موجود دائماً.
      عادات صحية + قلب داعم = بطل حقيقي! 💜
    </div>
    <div class="center">
      <button class="btn secondary" onclick="showMap()">🗺️ العودة للمسار</button>
      <button class="btn danger small" onclick="resetGame()">🔄 لعبة جديدة من البداية</button>
    </div>
  `);
}
function resetGame(){
  state.stars = [0,0,0,0,0];
  state.score = 0;
  saveState();
  showStart();
}

/* انطلق! */
loadState();
showStart();
</script>
